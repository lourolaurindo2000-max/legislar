<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Plenário</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .gold-border {
            border: 2px solid #d4af37;
        }

        .gold-text {
            color: #d4af37;
        }

        .gold-bg {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #0b172a;
        }

        .gold-bg:hover {
            background: linear-gradient(135deg, #e6be44, #bb910b);
        }

        .card-container {
            background: #0f223e;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        /* STABLE SMART TV MODE: Eliminating jitter completely with static container sizing */
        body.smart-tv-mode {
            background-color: #08111d !important;
        }

        body.smart-tv-mode .main-wrapper {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            padding: 2vh 4vw !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 9999 !important;
            background-color: #0b172a !important;
            overflow-y: auto !important;
        }

        body.smart-tv-mode .card-container {
            width: 70vw !important;
            max-width: 900px !important;
            padding: 2.5rem !important;
        }

        body.smart-tv-mode h1 {
            font-size: 2.5rem !important;
        }

        body.smart-tv-mode h2 {
            font-size: 2.2rem !important;
        }

        body.smart-tv-mode .avatar-box {
            width: 9rem !important;
            height: 9rem !important;
        }

        body.smart-tv-mode .main-btn {
            font-size: 1.5rem !important;
            padding: 1rem 2.5rem !important;
        }

        /* Modo administrador discreto */
        #admin-gear {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 10000;
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            color: #d4af37;
            opacity: 0.12;
            font-size: 13px;
            cursor: pointer;
            transition: opacity .3s, transform .6s;
        }
        #admin-gear:hover, #admin-gear:focus-visible {
            opacity: 0.6;
            transform: rotate(90deg);
            outline: none;
        }
        #admin-modal {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(4, 10, 20, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #admin-modal.aberto { display: flex; }
        .admin-box {
            background: #0f223e;
            border: 1px solid rgba(212, 175, 55, .5);
            border-radius: 18px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,.8);
        }
        .admin-btn {
            background: #1e293b;
            border: 1px solid rgba(212, 175, 55, .4);
            color: #e2e8f0;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-btn:hover { background: #334155; }
        .admin-input {
            background: #0b172a;
            border: 1px solid rgba(212, 175, 55, .4);
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
        }
        .admin-input:focus { outline: 2px solid #d4af37; outline-offset: 1px; }
        @keyframes tremer { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
        .tremer { animation: tremer .3s 2; }
    </style>
</head>
<body class="smart-tv-mode py-4 px-4 selection:bg-amber-500 selection:text-black">

    <div class="main-wrapper w-full max-w-4xl flex flex-col items-center justify-between mx-auto flex-1">
        
        <!-- Topo / Título -->
        <header class="text-center w-full mb-3">
            <p class="text-xs sm:text-sm tracking-[0.25em] font-semibold gold-text uppercase mb-1">Sorteio</p>
            <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold tracking-wide uppercase text-white">Plenário Jonas Plínio</h1>
        </header>

        <!-- Área Central de Sorteio -->
        <main class="w-full max-w-xl mx-auto my-auto flex flex-col items-center">
            <div class="card-container w-full rounded-3xl p-6 sm:p-8 gold-border flex flex-col items-center text-center">
                
                <!-- Foto / Avatar Central -->
                <div class="avatar-box w-28 h-28 sm:w-36 sm:h-36 rounded-full overflow-hidden gold-border p-1 bg-[#0b172a] mb-4 shadow-2xl flex items-center justify-center">
                    <img id="central-photo" src="https://1.gravatar.com/userimage/277172047/ece539c2e94b37ca6e47ae679ff1e7c8?size=512" alt="Parlamentar Sorteado" class="w-full h-full object-cover rounded-full">
                </div>

                <!-- Título / Estado / Nome do Parlamentar -->
                <h2 id="status-title" class="text-xl sm:text-2xl md:text-3xl font-bold text-white mb-2 tracking-wide min-h-[3.5rem] flex items-center justify-center">Aguardando Início</h2>
                
                <!-- Nome do Presidente -->
                <p id="president-name" class="text-xs sm:text-sm gold-text font-medium uppercase tracking-wider mb-5">Presidente - Rogério Gotado</p>

                <!-- Cronômetro de 5 Segundos -->
                <div id="countdown-timer" class="text-amber-400 font-bold text-lg sm:text-xl mb-3 hidden tracking-widest">
                    Sorteando em <span id="timer-number">5</span>s...
                </div>

                <!-- Histórico de Parlamentares Sorteados Abaixo -->
                <div id="winner-history-container" class="w-full mb-5 hidden">
                    <div class="border-t border-slate-700 pt-3 w-full">
                        <p class="text-xs uppercase tracking-widest text-amber-300 font-semibold mb-2 text-left"><i class="fa-solid fa-list-check mr-1"></i> Sorteados:</p>
                        <div id="history-list" class="flex flex-col gap-2 max-h-36 overflow-y-auto pr-1">
                            <!-- Itens inseridos dinamicamente -->
                        </div>
                    </div>
                </div>

                <!-- Botão de Sorteio -->
                <div class="flex flex-col w-full justify-center items-center">
                    <button id="btn-sortear" class="main-btn gold-bg font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform active:scale-95 text-base sm:text-lg tracking-wider w-full uppercase cursor-pointer">
                        <i class="fa-solid fa-dice mr-2"></i> Sortear
                    </button>
                </div>
            </div>
        </main>

        <!-- Rodapé com Tela Cheia e Sair -->
        <footer class="w-full flex flex-col sm:flex-row justify-between items-center gap-3 mt-4 text-xs text-slate-400">
            <p id="total-info" class="text-center sm:text-left">09 Vereadores na urna</p>

            <div class="flex items-center gap-2">
                <!-- Tela Cheia -->
                <button id="btn-tv-mode" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg gold-border transition-all flex items-center gap-2 cursor-pointer shadow-md">
                    <i id="tv-mode-icon" class="fa-solid fa-expand text-amber-400"></i> <span id="tv-mode-text">Tela Cheia</span>
                </button>
                
                <!-- Sair da Página -->
                <button id="btn-sair" class="bg-red-950/80 hover:bg-red-900 text-red-200 px-3 py-2 rounded-lg border border-red-500/50 transition-all flex items-center gap-2 cursor-pointer shadow-md">
                    <i class="fa-solid fa-power-off text-red-400"></i> Sair
                </button>
            </div>
        </footer>
    </div>

    <!-- Acesso administrativo discreto -->
    <button id="admin-gear" type="button" title="Configurações" aria-label="Configurações">
        <i class="fa-solid fa-gear"></i>
    </button>

    <div id="admin-modal" role="dialog" aria-modal="true" aria-label="Modo administrador">
        <div class="admin-box">
            <!-- Etapa 1: senha -->
            <form id="admin-login" class="flex flex-col items-center text-center gap-3">
                <i class="fa-solid fa-lock gold-text text-2xl"></i>
                <p class="text-sm font-semibold tracking-widest uppercase gold-text">Acesso restrito</p>
                <input id="admin-senha" type="password" autocomplete="off" placeholder="Senha" class="admin-input w-full max-w-xs text-center">
                <p id="admin-erro" class="text-xs text-red-400 min-h-[1rem]"></p>
                <div class="flex gap-2">
                    <button type="button" class="admin-btn admin-fechar">Cancelar</button>
                    <button type="submit" class="admin-btn" style="background:#d4af37;color:#0b172a;font-weight:700">Entrar</button>
                </div>
            </form>

            <!-- Etapa 2: painel -->
            <div id="admin-painel" class="hidden flex-col gap-5 text-left">
                <div class="flex items-center justify-between">
                    <p class="font-bold gold-text tracking-wider uppercase text-sm"><i class="fa-solid fa-lock-open mr-2"></i>Modo administrador</p>
                    <button type="button" class="admin-btn admin-fechar"><i class="fa-solid fa-xmark mr-1"></i>Fechar</button>
                </div>

                <!-- Tempo da contagem -->
                <section>
                    <p class="text-xs uppercase tracking-widest text-amber-300 font-semibold mb-2">Tempo da contagem regressiva</p>
                    <div class="flex items-center gap-2">
                        <button type="button" class="admin-btn" id="tempo-menos">−</button>
                        <input id="admin-tempo" type="number" min="1" max="120" class="admin-input w-20 text-center">
                        <button type="button" class="admin-btn" id="tempo-mais">+</button>
                        <span class="text-sm text-slate-300">segundos</span>
                    </div>
                </section>

                <!-- Brasão -->
                <section>
                    <p class="text-xs uppercase tracking-widest text-amber-300 font-semibold mb-2">Foto do brasão</p>
                    <div class="flex items-center gap-3">
                        <img id="admin-brasao-prev" alt="Brasão" class="w-14 h-14 rounded-full object-cover border border-amber-400 bg-[#0b172a]">
                        <label class="admin-btn"><i class="fa-solid fa-upload mr-1"></i>Trocar<input type="file" accept="image/*" id="admin-brasao-file" class="hidden"></label>
                        <button type="button" class="admin-btn" id="admin-brasao-reset" title="Restaurar original"><i class="fa-solid fa-rotate-left"></i></button>
                    </div>
                </section>

                <!-- Vereadores -->
                <section>
                    <p class="text-xs uppercase tracking-widest text-amber-300 font-semibold mb-2">Fotos dos vereadores</p>
                    <div id="admin-lista" class="flex flex-col gap-2"></div>
                </section>

                <p id="admin-msg" class="text-xs text-emerald-400 min-h-[1rem]"></p>
                <div class="flex justify-between gap-2">
                    <button type="button" class="admin-btn" id="admin-zerar-urna"><i class="fa-solid fa-box-open mr-1"></i>Zerar urna</button>
                    <button type="button" class="admin-btn" id="admin-restaurar-tudo"><i class="fa-solid fa-trash-can-arrow-up mr-1"></i>Restaurar tudo</button>
                    <button type="button" class="admin-btn" id="admin-bloquear"><i class="fa-solid fa-lock mr-1"></i>Bloquear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase (sincronização em tempo real) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        $(document).ready(function() {
            // Lista oficial dos 9 parlamentares com fotos profissionais
            const vereadoresOriginais = [
                { nome: "Vereador José Lindomar", foto: "https://1.gravatar.com/userimage/277172047/8b0bc09db080b520bb5efcac97fdac7d?size=256" },
                { nome: "Vereador Sylas Souza", foto: "https://2.gravatar.com/userimage/277172047/599489b917ada4c8af9a7add57a38d56?size=256" },
                { nome: "Vereador Lucas Cavalcante", foto: "https://2.gravatar.com/userimage/277172047/21cee79305a9e7882d6ae14f87a77652?size=256" },
                { nome: "Vereador Dilson Junior", foto: "https://1.gravatar.com/userimage/277172047/663db92eb90b94a5fce1914f09f97435?size=256" },
                { nome: "Vereador Rogério Gotádo", foto: "https://2.gravatar.com/userimage/277172047/cd0c7fd16ed7a3be204e382e86af7e23?size=256" },
                { nome: "Vereador Wilson Freitas", foto: "https://0.gravatar.com/userimage/277172047/9342d191dbd2a0115384f72754b0056b?size=256" },
                { nome: "Vereadora Nilza Damasceno", foto: "https://1.gravatar.com/userimage/277172047/1664047f373debf8b5651065a72ff1ea?size=256" },
                { nome: "Vereadora Marilene Costa", foto: "https://2.gravatar.com/userimage/277172047/649f18d55aefc7b14c929b5b4cbb3f0d?size=256" },
                { nome: "Vereador Jackson Costa", foto: "https://2.gravatar.com/userimage/277172047/8039d08ed8a294328b8f8b70bbbeb765?size=256" }
            ];
            const TOTAL = vereadoresOriginais.length;

            // ===================================================================
            //  FIREBASE — sorteio salvo e sincronizado em todos os aparelhos
            // ===================================================================
            const firebaseConfig = {
                apiKey: "AIzaSyAHawTmb2za8y2Eq70FWejq64-5J6Pbqfo",
                authDomain: "projeto-teste-f08c4.firebaseapp.com",
                databaseURL: "https://projeto-teste-f08c4-default-rtdb.firebaseio.com",
                projectId: "projeto-teste-f08c4",
                storageBucket: "projeto-teste-f08c4.firebasestorage.app",
                messagingSenderId: "788863562302",
                appId: "1:788863562302:web:2ddcfb6c2c892770de976f"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const refEstado = db.ref('legislar/sorteioFala/estado');   // { sorteados:[índices], fim }
            const refConfig = db.ref('legislar/sorteioFala/config');   // { tempo, brasao, fotos:{v0..v8} }

            let serverOffset = 0;
            db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
            const agora = () => Date.now() + serverOffset;

            // Este aparelho é a Smart TV? (dentro do quadro da TV, marcado como TV ou navegador de TV)
            const ESTA_TV = (function () {
                let tv = false;
                try { tv = window.self !== window.top || localStorage.getItem('pld_tv') === '1'; } catch (e) { tv = true; }
                if (/SmartTV|SMART-TV|Tizen|Web0S|webOS|NetCast|HbbTV|BRAVIA|SonyDTV|\bAFT[A-Z]|GoogleTV|Google TV|Android ?TV|CrKey|Roku|VIDAA|NETTV|Viera|AQUOS|Opera TV|LG Browser|Large Screen|PhilipsTV|Hisense.*TV|TV Safari/i.test(navigator.userAgent || '')) tv = true;
                return tv;
            })();
            // A TV pode abrir o sorteio alguns segundos depois do clique: aceita sorteios de até 1 min antes
            const MARGEM_TV = ESTA_TV ? 60 * 1000 : 0;

            let estado = { sorteados: [], fim: 0 };
            let sorteadosHistorico = [];
            let emSorteio = false;
            let shuffleTimer = null;

            // ===== Configurações (modo administrador) =====
            const CHAVE_CFG = 'sorteioPlenarioAdmin';
            const BRASAO_PADRAO = "https://1.gravatar.com/userimage/277172047/ece539c2e94b37ca6e47ae679ff1e7c8?size=512";
            const FOTOS_PADRAO = vereadoresOriginais.map(v => v.foto);
            let cfg = { tempo: 5, brasao: null, fotos: {} };
            let logoInicial = BRASAO_PADRAO;
            $('#central-photo').attr('src', logoInicial);
            $('#timer-number').text(cfg.tempo);

            // Fotos ficam no banco como v0..v8 (índice do vereador)
            const fotoDe = i => (cfg.fotos && cfg.fotos['v' + i]) || FOTOS_PADRAO[i];
            // Sorteios de mais de 3 horas atrás são de outra sessão: a urna volta cheia
            const VALIDADE_MS = 3 * 60 * 60 * 1000;
            const expirado = e => !!(e && e.fim) && agora() - e.fim > VALIDADE_MS;
            const limpar = arr => Array.isArray(arr) ? arr.filter(n => n !== null && n !== undefined) : [];
            // Início da sessão: gravado no banco quando o tablet/notebook abre o Sorteio (vale para todos, inclusive a TV).
            // Sem essa marca, vale o momento em que esta tela abriu.
            const inicioSessao = e => (e && e.inicio) || (abertaEm - MARGEM_TV);
            // Só vale o sorteio feito depois do início da sessão: sorteios antigos não aparecem
            const daSessao = e => !!(e && e.fim) && abertaEm > 0 && e.fim >= inicioSessao(e);
            const lista = () => (expirado(estado) || !daSessao(estado)) ? [] : limpar(estado.sorteados);
            const contando = () => !!estado.fim && agora() < estado.fim;
            // Momento em que esta tela abriu: só destaca no centro sorteios feitos depois disso
            let abertaEm = 0;
            db.ref('.info/serverTimeOffset').once('value', () => {
                abertaEm = agora();
                // Tablet/notebook abriu (ou recarregou) o Sorteio: começa sessão nova, sem nenhum vereador sorteado.
                // Se houver um sorteio rodando agora, não interrompe.
                if (!ESTA_TV) refEstado.transaction(cur => {
                    cur = cur || {};
                    if (cur.fim && abertaEm < cur.fim) return;
                    return Object.assign({}, cur, { inicio: abertaEm });
                }).catch(() => {});
                render();
            });

            refConfig.on('value', snap => {
                const v = snap.val();
                if (!v) {
                    // Primeira vez: aproveita o que estava salvo neste aparelho (se houver)
                    let local = null;
                    try { local = JSON.parse(localStorage.getItem(CHAVE_CFG) || 'null'); } catch (err) {}
                    const fotos = {};
                    if (local && local.fotos) Object.keys(local.fotos).forEach(k => { if (local.fotos[k]) fotos['v' + k] = local.fotos[k]; });
                    refConfig.set({ tempo: (local && local.tempo) || 5, brasao: (local && local.brasao) || null, fotos });
                    return;
                }
                cfg = { tempo: v.tempo || 5, brasao: v.brasao || null, fotos: v.fotos || {} };
                vereadoresOriginais.forEach((ver, i) => ver.foto = fotoDe(i));
                aplicarBrasao();
                if (!emSorteio) $('#timer-number').text(cfg.tempo);
                if ($('#admin-painel').hasClass('flex')) { $('#admin-tempo').val(cfg.tempo); montarLista(); }
                render();
            });

            refEstado.on('value', snap => {
                estado = Object.assign({ sorteados: [], fim: 0 }, snap.val() || {});
                render();
            }, err => {
                console.error('Firebase: sem permissão. Verifique as regras do banco.', err);
                $('#status-title').text('Sem conexão com o banco');
            });

            // Desenha a tela a partir do estado do banco (igual em todos os aparelhos)
            function render() {
                const todos = lista();
                const visiveis = contando() ? todos.slice(0, -1) : todos;
                sorteadosHistorico = visiveis.map(i => vereadoresOriginais[i]).filter(Boolean);
                const restantes = TOTAL - visiveis.length;

                $('#total-info').text(visiveis.length === 0 ? '09 Vereadores na urna' : `${restantes} de 9 vereadores restantes na urna`);

                if (sorteadosHistorico.length === 0) {
                    $('#winner-history-container').addClass('hidden');
                    $('#history-list').empty();
                } else {
                    atualizarHistoricoVisual();
                }

                if (contando()) { iniciarAnimacao(); return; }
                pararAnimacao();

                $('#btn-sortear').prop('disabled', false).removeClass('opacity-75');
                const sorteioRecente = abertaEm && estado.fim && estado.fim >= inicioSessao(estado);
                if (sorteadosHistorico.length && sorteioRecente) {
                    const vencedor = sorteadosHistorico[sorteadosHistorico.length - 1];
                    $('#status-title').html(`<span class="text-amber-400 drop-shadow-md">${vencedor.nome}</span>`);
                    $('#central-photo').attr('src', vencedor.foto);
                    if (restantes === 0) {
                        $('#btn-sortear').html('<i class="fa-solid fa-rotate-right mr-2"></i> Novo Ciclo de Sorteio');
                    } else {
                        $('#btn-sortear').html('<i class="fa-solid fa-dice mr-2"></i> Sortear Próximo');
                    }
                } else {
                    $('#status-title').text('Aguardando Início');
                    $('#central-photo').attr('src', logoInicial);
                    if (restantes === 0) {
                        $('#btn-sortear').html('<i class="fa-solid fa-rotate-right mr-2"></i> Novo Ciclo de Sorteio');
                    } else if (sorteadosHistorico.length) {
                        $('#btn-sortear').html('<i class="fa-solid fa-dice mr-2"></i> Sortear Próximo');
                    } else {
                        $('#btn-sortear').html('<i class="fa-solid fa-dice mr-2"></i> Sortear');
                    }
                }
            }

            // Embaralhamento + contagem regressiva, guiados pelo relógio do servidor
            function iniciarAnimacao() {
                emSorteio = true;
                $('#btn-sortear').prop('disabled', true).addClass('opacity-75');
                $('#countdown-timer').removeClass('hidden');
                if (shuffleTimer) return;
                shuffleTimer = setInterval(function() {
                    const falta = Math.ceil((estado.fim - agora()) / 1000);
                    if (falta <= 0) { pararAnimacao(); render(); return; }
                    $('#timer-number').text(falta);
                    let randomParlamentar = vereadoresOriginais[Math.floor(Math.random() * vereadoresOriginais.length)];
                    $('#status-title').text(randomParlamentar.nome);
                    $('#central-photo').attr('src', randomParlamentar.foto);
                }, 90);
            }
            function pararAnimacao() {
                clearInterval(shuffleTimer); shuffleTimer = null;
                emSorteio = false;
                $('#countdown-timer').addClass('hidden');
                $('#timer-number').text(cfg.tempo);
            }

            // A página já abre no layout de tela cheia; o botão liga/desliga a tela cheia do navegador
            function emTelaCheia() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }
            function atualizarBotaoTelaCheia() {
                if (emTelaCheia()) {
                    $('#tv-mode-text').text('Sair da Tela Cheia');
                    $('#tv-mode-icon').removeClass('fa-expand').addClass('fa-compress');
                } else {
                    $('#tv-mode-text').text('Tela Cheia');
                    $('#tv-mode-icon').removeClass('fa-compress').addClass('fa-expand');
                }
            }
            document.addEventListener('fullscreenchange', atualizarBotaoTelaCheia);
            document.addEventListener('webkitfullscreenchange', atualizarBotaoTelaCheia);

            $('#btn-tv-mode').on('click', function(e) {
                e.preventDefault();
                var de = document.documentElement;
                if (emTelaCheia()) {
                    var x = document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen && document.webkitExitFullscreen());
                    if (x && x.catch) x.catch(function () {});
                } else {
                    var p = de.requestFullscreen ? de.requestFullscreen() : (de.webkitRequestFullscreen && de.webkitRequestFullscreen());
                    if (p && p.catch) p.catch(function () {});
                }
            });

            // Smart TV (dentro do quadro da TV ou aparelho marcado como TV): já abre em tela cheia,
            // então o botão "Tela Cheia" não aparece lá (continua só no notebook)
            (function () {
                var ehTV = false;
                try { ehTV = window.self !== window.top || localStorage.getItem('pld_tv') === '1'; } catch (e) { ehTV = true; }
                if (/SmartTV|SMART-TV|Tizen|Web0S|webOS|NetCast|HbbTV|BRAVIA|SonyDTV|\bAFT[A-Z]|GoogleTV|Google TV|Android ?TV|CrKey|Roku|VIDAA|NETTV|Viera|AQUOS|Opera TV|LG Browser|Large Screen|PhilipsTV|Hisense.*TV|TV Safari/i.test(navigator.userAgent || '')) ehTV = true;   // navegador de Smart TV (Samsung, LG, Sony, Android/Google TV, Fire TV, Roku…)
                if (ehTV) $('#btn-tv-mode').remove();
            })();

            // Entra em tela cheia no primeiro gesto (o navegador não permite sem um toque ou tecla)
            (function () {
                var EV = ['click', 'keydown', 'change'], NAO = 'select,a,label,input[type=file],#btn-tv-mode,#btn-sair,#admin-gear,#admin-modal';
                function off() { EV.forEach(function (t) { document.removeEventListener(t, auto, true); }); }
                function auto(e) {
                    var t = e.target, de = document.documentElement;
                    if (document.fullscreenElement || document.webkitFullscreenElement || !(de.requestFullscreen || de.webkitRequestFullscreen)) { off(); return; }
                    if (e.type === 'keydown' && e.key === 'Escape') return;
                    if (e.type !== 'change' && t.closest && t.closest(NAO)) return;
                    var p = de.requestFullscreen ? de.requestFullscreen() : de.webkitRequestFullscreen();
                    if (p && p.then) p.then(off, function () {}); else off();
                }
                EV.forEach(function (t) { document.addEventListener(t, auto, true); });
            })();

            // Função do Botão Sair da Página
            $('#btn-sair').on('click', function(e) {
                e.preventDefault();
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
                try { window.close(); } catch(err) {}
                setTimeout(function() {
                    if (!window.closed) {
                        window.location.replace("dashboard.html");
                    }
                }, 300);
            });

            // Ação principal de Sorteio — grava no banco; todos os aparelhos acompanham
            $('#btn-sortear').on('click', function(e) {
                e.preventDefault();
                if (emSorteio || contando()) return;
                const duracao = (cfg.tempo || 5) * 1000;

                // Qualquer aparelho (notebook, tablet, celular) que sortear faz a Smart TV abrir o Sorteio
                if (!ESTA_TV) db.ref('legislar/painel/tela').set({ pagina: 'sistema_sorteio.html', em: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});

                // Transação: só um sorteio por vez e sem repetir vereador
                refEstado.transaction(cur => {
                    cur = cur || {};
                    const t = agora();
                    if (cur.fim && t < cur.fim) return;   // já há um sorteio em andamento
                    let usados = (expirado(cur) || !daSessao(cur)) ? [] : limpar(cur.sorteados);
                    if (usados.length >= TOTAL) usados = [];   // Novo ciclo automático após os 9
                    const disponiveis = vereadoresOriginais.map((v, i) => i).filter(i => !usados.includes(i));
                    const sorteado = disponiveis[Math.floor(Math.random() * disponiveis.length)];
                    return { sorteados: [...usados, sorteado], fim: t + duracao, inicio: cur.inicio || null };
                });
            });

            // ===== Modo administrador =====
            // Senha guardada como hash SHA-256 (não aparece em texto no código)
            const HASH_SENHA = '85ce9c211a744825d0ee2708bb63e4882f161f37e5ee33a2e928053cd4c6d316';
            async function hashTexto(t) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            async function senhaCorreta(t) {
                if (window.crypto && crypto.subtle) return (await hashTexto(t)) === HASH_SENHA;
                return btoa(t) === 'YWxtYWRpbmEyMDI2'; // navegadores antigos sem crypto.subtle
            }

            function abrirAdmin() {
                $('#admin-modal').addClass('aberto');
                $('#admin-painel').addClass('hidden').removeClass('flex');
                $('#admin-login').removeClass('hidden');
                $('#admin-senha').val('');
                $('#admin-erro').text('');
                setTimeout(() => $('#admin-senha').trigger('focus'), 50);
            }
            function fecharAdmin() { $('#admin-modal').removeClass('aberto'); $('#admin-painel').addClass('hidden').removeClass('flex'); }

            $('#admin-gear').on('click', function (e) { e.preventDefault(); e.stopPropagation(); abrirAdmin(); });
            $(document).on('click', '.admin-fechar, #admin-bloquear', fecharAdmin);
            $('#admin-modal').on('click', function (e) { if (e.target === this) fecharAdmin(); });
            $(document).on('keydown', function (e) { if (e.key === 'Escape' && $('#admin-modal').hasClass('aberto')) fecharAdmin(); });

            $('#admin-login').on('submit', async function (e) {
                e.preventDefault();
                if (await senhaCorreta($('#admin-senha').val())) {
                    $('#admin-login').addClass('hidden');
                    $('#admin-painel').removeClass('hidden').addClass('flex');
                    montarPainel();
                } else {
                    $('#admin-erro').text('Senha incorreta');
                    $('#admin-senha').val('');
                    $('.admin-box').removeClass('tremer'); void document.querySelector('.admin-box').offsetWidth; $('.admin-box').addClass('tremer');
                }
            });

            function avisar(txt) {
                $('#admin-msg').removeClass('text-red-400').addClass('text-emerald-400').text(txt);
                clearTimeout(avisar.t); avisar.t = setTimeout(() => $('#admin-msg').text(''), 2500);
            }
            function erroSalvar(err) {
                console.error(err);
                $('#admin-msg').removeClass('text-emerald-400').addClass('text-red-400').text('Não foi possível salvar no banco. Verifique a conexão e as regras do Firebase.');
            }

            // Reduz a imagem antes de salvar (fica leve no banco)
            function lerImagem(file, max, png, cb) {
                const r = new FileReader();
                r.onload = function () {
                    const img = new Image();
                    img.onload = function () {
                        const s = Math.min(1, max / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        cb(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = r.result;
                };
                r.readAsDataURL(file);
            }

            function mostrandoBrasao() { return !emSorteio && sorteadosHistorico.length === 0; }
            function aplicarBrasao() {
                logoInicial = cfg.brasao || BRASAO_PADRAO;
                $('#admin-brasao-prev').attr('src', logoInicial);
                if (mostrandoBrasao()) $('#central-photo').attr('src', logoInicial);
            }

            function montarLista() {
                let html = '';
                vereadoresOriginais.forEach((v, i) => {
                    html += `
                        <div class="flex items-center justify-between gap-2 bg-slate-900/80 border border-amber-500/20 rounded-xl px-3 py-2">
                            <div class="flex items-center gap-2 min-w-0">
                                <img src="${v.foto}" alt="" class="w-9 h-9 rounded-full object-cover border border-amber-400 shrink-0">
                                <span class="text-sm truncate">${v.nome}</span>
                            </div>
                            <div class="flex gap-1 shrink-0">
                                <label class="admin-btn"><i class="fa-solid fa-camera"></i><input type="file" accept="image/*" class="hidden admin-foto-file" data-i="${i}"></label>
                                ${cfg.fotos['v' + i] ? `<button type="button" class="admin-btn admin-foto-reset" data-i="${i}" title="Restaurar original"><i class="fa-solid fa-rotate-left"></i></button>` : ''}
                            </div>
                        </div>`;
                });
                $('#admin-lista').html(html);
            }

            function montarPainel() {
                $('#admin-tempo').val(cfg.tempo);
                $('#admin-brasao-prev').attr('src', logoInicial);
                montarLista();
            }

            function definirTempo(n) {
                n = Math.max(1, Math.min(120, parseInt(n, 10) || 5));
                $('#admin-tempo').val(n);
                refConfig.child('tempo').set(n).then(() => avisar(`Contagem ajustada para ${n} segundos`), erroSalvar);
            }
            $('#admin-tempo').on('change', function () { definirTempo(this.value); });
            $('#tempo-menos').on('click', () => definirTempo(cfg.tempo - 1));
            $('#tempo-mais').on('click', () => definirTempo(cfg.tempo + 1));

            $('#admin-brasao-file').on('change', function () {
                const f = this.files[0]; this.value = '';
                if (!f) return;
                lerImagem(f, 512, true, function (url) {
                    refConfig.child('brasao').set(url).then(() => avisar('Brasão atualizado'), erroSalvar);
                });
            });
            $('#admin-brasao-reset').on('click', function () {
                refConfig.child('brasao').remove().then(() => avisar('Brasão original restaurado'), erroSalvar);
            });

            $(document).on('change', '.admin-foto-file', function () {
                const i = +$(this).data('i'), f = this.files[0];
                if (!f) return;
                lerImagem(f, 400, false, function (url) {
                    refConfig.child('fotos/v' + i).set(url).then(() => avisar('Foto atualizada: ' + vereadoresOriginais[i].nome), erroSalvar);
                });
            });
            $(document).on('click', '.admin-foto-reset', function () {
                const i = +$(this).data('i');
                refConfig.child('fotos/v' + i).remove().then(() => avisar('Foto original restaurada'), erroSalvar);
            });

            $('#admin-zerar-urna').on('click', function () {
                if (!confirm('Devolver os 9 vereadores para a urna e apagar a lista de sorteados em todos os aparelhos?')) return;
                refEstado.set({ sorteados: [], fim: 0 }).then(() => avisar('Urna zerada: 09 vereadores na urna'), erroSalvar);
            });

            $('#admin-restaurar-tudo').on('click', function () {
                if (!confirm('Restaurar todas as fotos e o tempo originais?')) return;
                refConfig.set({ tempo: 5, brasao: null, fotos: {} }).then(() => avisar('Tudo restaurado'), erroSalvar);
                try { localStorage.removeItem(CHAVE_CFG); } catch (err) {}
            });

            // Atualiza a lista de histórico na tela com as fotos
            function atualizarHistoricoVisual() {
                if (sorteadosHistorico.length > 0) {
                    $('#winner-history-container').removeClass('hidden');
                    let htmlList = '';

                    sorteadosHistorico.forEach((item, idx) => {
                        htmlList += `
                            <div class="flex items-center justify-between bg-slate-900/90 border border-amber-500/30 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium">
                                <div class="flex items-center gap-2.5">
                                    <span class="text-amber-400 font-bold w-5 text-center">${idx + 1}º</span>
                                    <img src="${item.foto}" alt="${item.nome}" class="w-7 h-7 rounded-full object-cover border border-amber-400">
                                    <span class="text-white">${item.nome}</span>
                                </div>
                                <span class="text-[10px] text-amber-300 font-semibold uppercase tracking-wider bg-amber-950/60 px-2 py-0.5 rounded border border-amber-500/20">Sorteado</span>
                            </div>
                        `;
                    });

                    $('#history-list').html(htmlList);
                }
            }
        });
    </script>
</body>
</html>
