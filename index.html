<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-primary: #070a13;
            --bg-card: rgba(15, 23, 42, 0.88);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(30, 41, 59, 0.6) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .fullscreen-btn:hover, .fullscreen-btn:focus {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
            outline: none;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2rem 1rem;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            text-align: center;
            position: relative;
        }

        .avatar-logo {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(3, 7, 18, 0.6);
            border: 3px solid rgba(37, 99, 235, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(37, 99, 235, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .avatar-box:hover {
            transform: scale(1.04);
            border-color: var(--accent-color);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-box svg {
            width: 65px;
            height: 65px;
            fill: #60a5fa;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 0.95rem 1.1rem;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
            background: rgba(3, 7, 18, 0.8);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.8rem;
        }

        .btn-login:hover, .btn-login:focus {
            background-color: var(--accent-hover);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
            outline: none;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        #alert-message {
            margin-top: 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.8rem;
            border-radius: 8px;
            display: none;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .ai-bot-widget {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 200;
        }

        .ai-bot-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
        }

        .ai-bot-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.6);
        }

        .ai-bot-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 11px;
            height: 11px;
            background-color: #22c55e;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }

        .ai-chat-box {
            position: absolute;
            bottom: 65px;
            left: 0;
            width: 320px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-chat-header {
            padding: 0.9rem 1rem;
            background: rgba(3, 7, 18, 0.6);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .ai-chat-body {
            padding: 1rem;
            height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.85rem;
        }

        .ai-msg {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.2);
            padding: 8px 12px;
            border-radius: 12px 12px 12px 2px;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .user-msg {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px 12px 2px 12px;
            align-self: flex-end;
            color: #ffffff;
        }

        .ai-chat-footer {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
        }

        .ai-chat-footer input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
        }

        .ai-chat-footer button {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            width: 100%;
            padding: 1.25rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: rgba(3, 7, 18, 0.5);
            backdrop-filter: blur(10px);
        }

        footer p {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        @media (min-width: 1920px) {
            .login-card {
                max-width: 560px;
                padding: 4rem 3.5rem;
            }
            .avatar-box {
                width: 130px;
                height: 130px;
            }
            .login-header h1 {
                font-size: 2.2rem;
            }
            .input-group input {
                padding: 1.2rem;
                font-size: 1.15rem;
            }
            .btn-login {
                padding: 1.2rem;
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <!-- Botão de Ativar Tela Cheia para Smart TV -->
    <button class="fullscreen-btn" id="btnFullscreen" title="Ativar Modo Tela Cheia">
        <i class="fa-solid fa-expand"></i>
        <span>Smart TV</span>
    </button>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Moldura Elegante para o brasao da camara -->
            <div class="avatar-logo">
                <div class="avatar-box">
                    <img src="img/logoCamara.PNG" alt="brasao" 
                         onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Foto_oficial_Lula_2023.jpg/800px-Foto_oficial_Lula_2023.jpg'; this.onerror=function(){ this.style.display='none'; document.getElementById('svgFallback').style.display='block'; };">
                    
                    <!-- Ícone Vetorial Elegante de Fallback -->
                    <svg id="svgFallback" viewBox="0 0 24 24" style="display:none;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
            </div>

            <div class="login-header">
                <h1>Acesso à Plenário</h1>
                <p>Insira suas credenciais para acessar o painel</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i> Acessar Sistema
                </button>
                
                <div id="alert-message"></div>
            </form>
        </div>
    </div>

    <div class="ai-bot-widget">
        <div class="ai-chat-box" id="aiChatBox">
            <div class="ai-chat-header">
                <span><i class="fa-solid fa-robot" style="color: #60a5fa; margin-right: 6px;"></i> Assistente do Sistema</span>
                <i class="fa-solid fa-xmark" id="closeAiChat" style="cursor: pointer;"></i>
            </div>
            <div class="ai-chat-body" id="aiChatBody">
                <div class="ai-msg">
                    Olá! Sou o assistente virtual do Plenário. Precisa de ajuda para acessar o painel do sistema?
                </div>
            </div>
            <div class="ai-chat-footer">
                <input type="text" id="aiInput" placeholder="Digite sua dúvida...">
                <button id="sendAiMsg"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
        <button class="ai-bot-btn" id="toggleAiBot" title="Assistente Virtual">
            <i class="fa-solid fa-robot"></i>
            <span class="ai-bot-badge"></span>
        </button>
    </div>

    <footer>
        <p><marquee>todos os direitos reservados a André Almeida.</marquee></p>
    </footer>

    <script>
        $(document).ready(function() {
            // CREDENCIAIS DE ACESSO
            const CREDENCIAIS_VALIDAS = {
                usuario: "admin",
                senha: "123"
            };

            const URL_DESTINO = "dashboard.html";

            // --- LÓGICA DE LOGIN ---
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                const userInput = $('#username').val().trim();
                const passInput = $('#password').val();
                const $alert = $('#alert-message');

                if (userInput === CREDENCIAIS_VALIDAS.usuario && passInput === CREDENCIAIS_VALIDAS.senha) {
                    $alert.removeClass('alert-error').addClass('alert-success')
                          .html('<i class="fa-solid fa-circle-check"></i> Autenticado com sucesso! Redirecionando...')
                          .fadeIn();

                    setTimeout(function() {
                        window.location.href = URL_DESTINO;
                    }, 1000);
                } else {
                    $alert.removeClass('alert-success').addClass('alert-error')
                          .html('<i class="fa-solid fa-circle-exclamation"></i> Usuário ou senha incorretos.')
                          .fadeIn();

                    $('#username, #password').css('border-color', 'var(--error-color)');
                    setTimeout(function() {
                        $('#username, #password').css('border-color', 'var(--border-color)');
                    }, 1500);
                }
            });

            // --- LÓGICA TELA CHEIA (SMART TV) ---
            $('#btnFullscreen').on('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Erro ao ativar tela cheia: ${err.message}`);
                    });
                    $(this).find('span').text('Sair da Tela Smart');
                    $(this).find('i').removeClass('fa-expand').addClass('fa-compress');
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                    $(this).find('span').text('Tela Smart');
                    $(this).find('i').removeClass('fa-compress').addClass('fa-expand');
                }
            });

            // --- LÓGICA DO BOT DE IA ---
            $('#toggleAiBot, #closeAiChat').on('click', function() {
                $('#aiChatBox').fadeToggle(200);
            });

            function enviarMensagemIA() {
                const texto = $('#aiInput').val().trim();
                if (!texto) return;

                $('#aiChatBody').append(`<div class="user-msg">${texto}</div>`);
                $('#aiInput').val('');
                $('#aiChatBody').scrollTop($('#aiChatBody')[0].scrollHeight);

                setTimeout(function() {
                    let resposta = "Para suporte técnico do sistema do plenário, entre em contato com a @andrealmeida ou pelo whatsapp (73)982444865.";
                    const lower = texto.toLowerCase();

                    if (lower.includes('senha') || lower.includes('usuario') || lower.includes('acesso')) {
                        resposta = "Para acessar o teste, utilize o usuário <b>admin</b> e a senha <b>123</b>.";
                    } else if (lower.includes('tv') || lower.includes('tela')) {
                        resposta = "Você pode clicar no botão 'Tela Cheia' no canto superior direito para adaptar a visualização para Smart TVs.";
                    } else if (lower.includes('olá') || lower.includes('oi')) {
                        resposta = "Olá! Como posso ajudar você a acessar o painel da plenária?";
                    }

                    $('#aiChatBody').append(`<div class="ai-msg">${resposta}</div>`);
                    $('#aiChatBody').scrollTop($('#aiChatBody')[0].scrollHeight);
                }, 600);
            }

            $('#sendAiMsg').on('click', enviarMensagemIA);
            $('#aiInput').on('keypress', function(e) {
                if (e.which === 13) enviarMensagemIA();
            });
        });
    </script>
</body>
</html>
