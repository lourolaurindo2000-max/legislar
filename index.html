<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema | Painel Plenária</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(147, 51, 234, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* Container Principal otimizado para Smart TVs */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
            color: #ffffff;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background-color: var(--accent-hover);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Mensagens de Alerta */
        #alert-message {
            margin-top: 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Rodapé com Direitos Autorais */
        footer {
            width: 100%;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: rgba(3, 7, 18, 0.4);
            backdrop-filter: blur(8px);
        }

        footer p {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.025em;
        }

        /* Ajustes específicos para telas grandes / Smart TVs */
        @media (min-width: 1920px) {
            .login-card {
                max-width: 620px;
                padding: 4rem;
            }
            .login-header h1 {
                font-size: 2.5rem;
            }
            .login-header p {
                font-size: 1.25rem;
            }
            .input-group input {
                padding: 1.25rem 1.5rem;
                font-size: 1.25rem;
            }
            .btn-login {
                padding: 1.25rem;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>Painel da Plenária</h1>
                <p>Entre com suas credenciais para acessar o sistema</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login">Acessar Sistema</button>
                
                <div id="alert-message"></div>
            </form>
        </div>
    </div>

    <footer>
        <p><marquee>todos os direitos reservados a André Almeida.</marquee></p>
    </footer>

    <script>
        $(document).ready(function() {
            // CONFIGURAÇÃO DE CREDENCIAIS (Altere aqui facilmente)
            const CREDENCIAIS_VALIDAS = {
                usuario: "admin",
                senha: "123"
            };

            // URL para onde o usuário será redirecionado após o login bem-sucedido
            const URL_DESTINO = ""; // Mude para a página principal do seu sistema

            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                const userInput = $('#username').val().trim();
                const passInput = $('#password').val();
                const $alert = $('#alert-message');

                // Validação simples
                if (userInput === CREDENCIAIS_VALIDAS.usuario && passInput === CREDENCIAIS_VALIDAS.senha) {
                    $alert.removeClass('alert-error').addClass('alert-success')
                          .text('Login bem-sucedido! Entrando no sistema...')
                          .fadeIn();

                    // Simula transição e redireciona
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    $alert.removeClass('alert-success').addClass('alert-error')
                          .text('Usuário ou senha incorretos. Tente novamente.')
                          .fadeIn();

                    // Efeito visual de erro nos inputs
                    $('#username, #password').css('border-color', 'var(--error-color)');
                    setTimeout(function() {
                        $('#username, #password').css('border-color', 'var(--border-color)');
                    }, 1500);
                }
            });
        });
    </script>
</body>
</html>
