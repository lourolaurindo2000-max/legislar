<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno do Plenário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EF;--surface:#fff;--ink:#17201D;--muted:#5B6762;--line:#D5DCD8;--brand:#1D4A3F;--accent:#9A7420;--danger:#A33A2F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101715;--surface:#18211E;--ink:#E7ECE9;--muted:#9AA7A1;--line:#2A3631;--brand:#2F7A66;--accent:#D1A64A;--danger:#E0776B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101715;--surface:#18211E;--ink:#E7ECE9;--muted:#9AA7A1;--line:#2A3631;--brand:#2F7A66;--accent:#D1A64A;--danger:#E0776B}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Literata,Georgia,serif;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);padding:.55rem .95rem;border-radius:8px;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;min-height:44px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.login-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2rem}
.login-box h1{margin:0 0 .25rem;font-size:1.7rem}
.login-box p{margin:0 0 1.5rem;color:var(--muted)}
.login-box label{display:block;margin:0 0 1rem;font-weight:500}
.login-box label input{margin-top:.3rem}
#err{color:var(--danger);min-height:1.5rem;margin:0 0 .5rem}

/* app */
header.top{display:flex;align-items:center;gap:.75rem;padding:.8rem 1.25rem;background:var(--brand);color:#fff}
header.top h1{margin:0;font-size:1.2rem;flex:1}
header.top .btn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;min-height:40px;padding:.4rem .8rem}
.stats{display:flex;flex-wrap:wrap;gap:.25rem 2rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--line);background:var(--surface)}
.stats div{display:flex;align-items:baseline;gap:.4rem}
.stats b{font:600 1.5rem Literata,Georgia,serif}
.stats span{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:340px 1fr;gap:1rem;padding:1rem 1.25rem;max-width:1200px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.list-tools{display:grid;gap:.6rem;margin-bottom:.8rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.3rem .8rem;min-height:36px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
ul.notes{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.item{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:8px;padding:.7rem .8rem}
.item.pronto{border-left-color:var(--brand)}
.item.proferido{border-left-color:var(--accent)}
.item.sel{outline:2px solid var(--brand)}
.item strong{display:block;font-family:Literata,Georgia,serif}
.item small{color:var(--muted)}
.empty{color:var(--muted);padding:1rem .25rem}
.editor{display:grid;gap:.8rem;align-content:start}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem}
.editor label{font-weight:500;font-size:.9rem;display:block}
.editor label>*{margin-top:.25rem}
#text{min-height:46vh;font:1.1rem/1.7 Literata,Georgia,serif;resize:vertical}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1;color:var(--muted);font-size:.9rem}
.fitem{display:flex;gap:.5rem;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem}
.fitem a{overflow-wrap:anywhere;color:var(--ink);text-decoration:underline}
.back{display:none}
.placeholder{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}

/* leitura */
#reader{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom,0px))}
#reader .bar{position:sticky;top:0;background:var(--bg);padding-bottom:.6rem}
#rbody{max-width:760px;margin:1rem auto;font-family:Literata,Georgia,serif;line-height:1.75;white-space:pre-wrap}
#rtitle{max-width:760px;margin:0 auto}

@media (max-width:800px){
 .layout{grid-template-columns:1fr;padding:.75rem}
 .row{grid-template-columns:1fr}
 body.editing #listPanel{display:none}
 body:not(.editing) #editPanel{display:none}
 .back{display:inline-block}
}
@media print{header.top,.stats,#listPanel,.bar{display:none!important}}
</style>
</head>
<body>

<section id="login">
 <form class="login-box" id="loginForm" autocomplete="off">
  <h1>Anotações do Vereador</h1>
  <p>Acesso restrito ao vereador.</p>
  <label>Nome<input id="u" type="text" autocomplete="username" required></label>
  <label>Senha<input id="p" type="password" autocomplete="current-password" required></label>
  <div id="err" role="alert"></div>
  <button class="btn primary" style="width:100%" type="submit">Entrar</button>
 </form>
</section>

<section id="app" class="hidden">
 <header class="top">
  <h1>Caderno do Plenário</h1>
  <span id="who"></span><small id="sync"></small>
  <button class="btn" id="logout">Sair</button>
 </header>
 <div class="stats" id="stats"></div>
 <div class="layout">
  <aside class="panel" id="listPanel">
   <div class="list-tools">
    <button class="btn primary" id="newBtn">Novo discurso</button>
    <input id="q" type="search" placeholder="Buscar nas anotações" aria-label="Buscar">
    <div class="chips" id="chips">
     <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
     <button class="chip" data-f="rascunho" aria-pressed="false">Rascunho</button>
     <button class="chip" data-f="pronto" aria-pressed="false">Pronto</button>
     <button class="chip" data-f="proferido" aria-pressed="false">Proferido</button>
    </div>
   </div>
   <ul class="notes" id="list"></ul>
  </aside>
  <main class="panel" id="editPanel">
   <div class="placeholder" id="ph"><div><h2>Nenhum discurso aberto</h2><p>Escolha um na lista ou crie um novo.</p></div></div>
   <div class="editor hidden" id="ed">
    <button class="btn ghost back" id="back">Voltar à lista</button>
    <label>Título<input id="title" placeholder="Ex.: Saúde no distrito rural"></label>
    <div class="row">
     <label>Data da sessão<input id="date" type="date"></label>
     <label>Tema<input id="theme" placeholder="Ex.: Saúde"></label>
     <label>Situação<select id="status"><option value="rascunho">Rascunho</option><option value="pronto">Pronto</option><option value="proferido">Proferido</option></select></label>
    </div>
    <label>Texto do discurso<textarea id="text" placeholder="Escreva aqui os pontos e o texto do discurso."></textarea></label>
    <div>
     <div class="bar"><strong>Anexos em PDF</strong><span class="grow"></span><button class="btn" id="pdfBtn">Anexar PDF</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" class="hidden"></div>
     <ul class="notes" id="flist" style="margin-top:.5rem"></ul>
    </div>
    <div class="bar">
     <span class="grow" id="meta"></span>
     <button class="btn" id="readBtn">Modo tribuna</button>
     <button class="btn" id="printBtn">Imprimir</button>
     <button class="btn danger" id="delBtn">Excluir</button>
    </div>
   </div>
  </main>
 </div>
</section>

<section id="reader" class="hidden">
 <div class="bar">
  <button class="btn" id="rclose">Fechar</button>
  <button class="btn" id="rminus" aria-label="Diminuir letra">A−</button>
  <button class="btn" id="rplus" aria-label="Aumentar letra">A+</button>
  <span class="grow" id="rtime"></span>
 </div>
 <h2 id="rtitle"></h2>
 <div id="rbody"></div>
</section>

<script>
(function(){
var H="4c4d2a9a2e5f4d5cfd2812031579878aa9a78d3579e39fc386b3e096e4e9d1a4",SALT="caderno-plenario-v1",KEY="caderno_notas_v1",SKEY="caderno_sessao_v1";
var mem={};
function st(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r===null?mem[k]:r}localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k];mem[k]=v}}
function $(i){return document.getElementById(i)}
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase()}
var notes=[],cur=null,filter="todos",timer=null,fsize=1.5;
try{notes=JSON.parse(st(KEY)||"[]")}catch(e){notes=[]}
var cloud=null,stamp={};
function cap(n){return window.claude&&claude.use?claude.use(n):Promise.resolve(null)}
function persist(){st(KEY,JSON.stringify(notes));push()}
function push(){if(!cloud)return;notes.forEach(function(x){if(stamp[x.id]!==x.updated){stamp[x.id]=x.updated;cloud.doc(x.id).set(x).catch(function(){stamp[x.id]=0;$("sync").textContent="Salvo neste aparelho"})}})}
function merge(arr){var by={};notes.forEach(function(x){by[x.id]=x});arr.forEach(function(c){if(!c||!c.id)return;var l=by[c.id];if(!l){notes.push(c)}else if((c.updated||0)>l.updated){Object.assign(l,c)}})}
function initCloud(){
 Promise.all([cap("db"),cap("user")]).then(function(r){
  if(!r[0]||!r[1])return null;
  return r[1].id().then(function(id){if(!id)return null;cloud=r[0].collection("data/users/"+id+"/notas");return cloud.get()});
 }).then(function(snap){
  if(!snap)return;
  var arr=[];snap.docs.forEach(function(d){var c=d.data();if(c){stamp[c.id]=c.updated;arr.push(c)}});
  merge(arr);st(KEY,JSON.stringify(notes));push();$("sync").textContent="Salvo na nuvem";render();
 }).catch(function(){cloud=null});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function words(t){var m=t.trim().match(/\S+/g);return m?m.length:0}
function mins(t){var w=words(t);return w?Math.max(1,Math.round(w/130)):0}
function fmt(d){if(!d)return "sem data";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function enter(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent="Vereador Jackson";$("sync").textContent="Salvo neste aparelho";try{navigator.storage.persist()}catch(e){}initCloud();render()}
$("loginForm").addEventListener("submit",function(e){
 e.preventDefault();
 Promise.resolve().then(function(){return sha(SALT+"|"+norm($("u").value)+"|"+$("p").value)}).then(function(h){if(h===H){st(SKEY,"ok");$("err").textContent="";enter()}else{fail()}}).catch(fail);
 function fail(){$("err").textContent="Nome ou senha incorretos. Confira e tente de novo.";$("p").value="";$("p").focus()}
});
$("logout").onclick=function(){st(SKEY,"");cur=null;document.body.classList.remove("editing");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("u").value="";$("p").value=""};

function render(){
 var n=notes.length,c=function(s){return notes.filter(function(x){return x.status===s}).length};
 var prox=notes.filter(function(x){return x.date&&x.status!=="proferido"}).sort(function(a,b){return a.date<b.date?-1:1})[0];
 $("stats").innerHTML="<div><b>"+n+"</b><span>discursos</span></div><div><b>"+c("rascunho")+"</b><span>em rascunho</span></div><div><b>"+c("pronto")+"</b><span>prontos</span></div><div><b>"+c("proferido")+"</b><span>proferidos</span></div>"+(prox?"<div><b>"+fmt(prox.date).slice(0,5)+"</b><span>próxima sessão</span></div>":"");
 var q=norm($("q").value);
 var vis=notes.filter(function(x){return(filter==="todos"||x.status===filter)&&(!q||norm(x.title+" "+x.theme+" "+x.text).indexOf(q)>-1)}).sort(function(a,b){return b.updated-a.updated});
 var L=$("list");
 if(!vis.length){L.innerHTML='<li class="empty">'+(n?"Nada encontrado com esse filtro.":"Você ainda não tem discursos. Toque em “Novo discurso” para começar.")+"</li>";return}
 L.innerHTML=vis.map(function(x){return '<li><button class="item '+x.status+(x.id===cur?" sel":"")+'" data-id="'+x.id+'"><strong>'+esc(x.title||"Sem título")+"</strong><small>"+fmt(x.date)+(x.theme?" · "+esc(x.theme):"")+"</small></button></li>"}).join("");
}
$("list").addEventListener("click",function(e){var b=e.target.closest(".item");if(b)open(b.dataset.id)});
$("q").addEventListener("input",render);
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;[].forEach.call($("chips").children,function(x){x.setAttribute("aria-pressed",x===b)});render()});

function get(){return notes.filter(function(x){return x.id===cur})[0]}
function open(id){
 cur=id;var x=get();if(!x)return;
 $("ph").classList.add("hidden");$("ed").classList.remove("hidden");
 $("title").value=x.title;$("date").value=x.date;$("theme").value=x.theme;$("status").value=x.status;$("text").value=x.text;
 meta();renderFiles();document.body.classList.add("editing");render();
}
function meta(extra){var t=$("text").value;$("meta").textContent=(extra?extra+" · ":"")+words(t)+" palavras · cerca de "+mins(t)+" min de fala"}
$("newBtn").onclick=function(){
 var x={id:uid(),title:"",date:new Date().toISOString().slice(0,10),theme:"",status:"rascunho",text:"",updated:Date.now()};
 notes.push(x);persist();open(x.id);$("title").focus();
};
function autosave(){
 var x=get();if(!x)return;
 x.title=$("title").value;x.date=$("date").value;x.theme=$("theme").value;x.status=$("status").value;x.text=$("text").value;x.updated=Date.now();
 meta("Salvando…");clearTimeout(timer);
 timer=setTimeout(function(){persist();meta("Salvo");render()},400);
}
["title","date","theme","status","text"].forEach(function(i){$(i).addEventListener("input",autosave);$(i).addEventListener("change",autosave)});
$("back").onclick=function(){document.body.classList.remove("editing")};
$("delBtn").onclick=function(){
 var x=get();if(!x)return;
 if(confirm("Excluir “"+(x.title||"Sem título")+"”? Essa ação não pode ser desfeita.")){
  if(cloud){cloud.doc(cur).delete().catch(function(){})}notes=notes.filter(function(n){return n.id!==cur});persist();cur=null;
  $("ed").classList.add("hidden");$("ph").classList.remove("hidden");document.body.classList.remove("editing");render();
 }
};
$("printBtn").onclick=function(){window.print()};

function applySize(){$("rbody").style.fontSize=fsize+"rem"}
$("readBtn").onclick=function(){
 var x=get();if(!x)return;
 $("rtitle").textContent=x.title||"Sem título";$("rbody").textContent=x.text||"(sem texto)";
 $("rtime").textContent="Tempo estimado: "+mins(x.text)+" min";
 applySize();$("reader").classList.remove("hidden");$("reader").scrollTop=0;
};
$("rclose").onclick=function(){$("reader").classList.add("hidden")};
$("rplus").onclick=function(){fsize=Math.min(3.5,fsize+.2);applySize()};
$("rminus").onclick=function(){fsize=Math.max(1,fsize-.2);applySize()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("reader").classList.add("hidden")});

function renderFiles(){
 var x=get(),L=$("flist");if(!x)return;
 var fs=x.files||[];
 L.innerHTML=fs.length?fs.map(function(f,i){return '<li class="fitem"><a href="/_blob/'+f.id+'" target="_blank" rel="noopener">'+esc(f.name)+'</a><button class="btn danger" data-i="'+i+'">Remover</button></li>'}).join(""):'<li class="empty">Nenhum PDF anexado.</li>';
}
$("flist").addEventListener("click",function(e){
 var b=e.target.closest("button[data-i]"),x=get();if(!b||!x)return;
 var i=+b.dataset.i,f=x.files[i];
 if(!confirm("Remover o anexo “"+f.name+"”?"))return;
 cap("assets").then(function(a){if(a)a.delete(f.id).catch(function(){})});
 x.files.splice(i,1);x.updated=Date.now();persist();renderFiles();
});
$("pdfBtn").onclick=function(){$("pdfFile").click()};
$("pdfFile").onchange=function(){
 var inp=this,f=inp.files[0];inp.value="";if(!f)return;
 var x=get();if(!x)return;
 if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){alert("Escolha um arquivo PDF.");return}
 if(f.size>20*1024*1024){alert("O PDF deve ter no máximo 20 MB.");return}
 var btn=$("pdfBtn");btn.disabled=true;btn.textContent="Enviando…";
 cap("assets").then(function(a){if(!a)throw new Error("na");return a.upload(f)})
 .then(function(r){(x.files=x.files||[]).push({id:r.id,name:f.name});x.updated=Date.now();persist();if(get()===x)renderFiles()})
 .catch(function(){alert("Não foi possível anexar o PDF. Esse recurso exige acesso com a conta Claude.")})
 .then(function(){btn.disabled=false;btn.textContent="Anexar PDF"});
};
if(st(SKEY)==="ok")enter();
})();
</script>
</body>
</html>
