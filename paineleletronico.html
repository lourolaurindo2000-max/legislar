<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Legislativo Eletrônico</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-card: rgba(16, 33, 65, 0.8);
            --accent-blue: #00d4ff;
            --btn-sim: #28a745;
            --btn-abs: #6c757d;
            --btn-nao: #dc3545;
            --status-empate: #ff9f00;
        }

        body {
            background: linear-gradient(135deg, #050b18 0%, #0a192f 100%);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .titulo-sessao h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-blue);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
        }

        .status-placar {
            background: var(--status-empate);
            color: #000;
            padding: 10px 30px;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255, 159, 0, 0.5);
        }

        /* Grid de Parlamentares */
        .grid-parlamentares {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-parlamentar {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .card-parlamentar:hover {
            border-color: var(--accent-blue);
            transform: translateY(-5px);
        }

        .foto-perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent-blue);
            margin: 0 auto 15px;
            overflow: hidden;
            background: #000;
        }

        .foto-perfil img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nome-parlamentar {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin-bottom: 5px;
            display: block;
        }

        .partido {
            color: #8892b0;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: block;
        }

        /* Botões de Voto */
        .botoes-voto {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .btn-voto {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-voto:hover { opacity: 1; }
        .btn-voto.active { opacity: 1; outline: 2px solid white; }

        .sim { background: var(--btn-sim); }
        .abs { background: var(--btn-abs); }
        .nao { background: var(--btn-nao); }

        /* Responsividade para Smart TVs e Telas Grandes */
        @media (min-width: 1920px) {
            .grid-parlamentares { grid-template-columns: repeat(3, 1fr); }
            .titulo-sessao h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="titulo-sessao">
        <h1>REQUERIMENTO 009/2026 - Câmara de Almadina-BA</h1>
        <small>FASE ÚNICA DE DISCUSSÕES E VOTAÇÃO | QUORUM: MAIORIA SIMPLES</small>
    </div>
    <div id="resultado-final" class="status-placar">AGUARDANDO</div>
</header>

<main class="grid-parlamentares" id="container-parlamentares">
    </main>

<script>
    $(document).ready(function() {
        // Dados dos parlamentares (Lula, Trump e 7 fictícios)
        const parlamentares = [
            { nome: "LUCAS CAVALCANTE", partido: "PT", foto: "https://2.gravatar.com/userimage/277172047/21cee79305a9e7882d6ae14f87a77652?size=256" },
            { nome: "JACKSON COSTA", partido: "REP", foto: "https://2.gravatar.com/userimage/277172047/8039d08ed8a294328b8f8b70bbbeb765?size=256" },
            { nome: "WILSON FREITAS", partido: "REP", foto: "https://0.gravatar.com/userimage/277172047/9342d191dbd2a0115384f72754b0056b?size=256" },
            { nome: "SYLAS SOUZA", partido: "PSDB", foto: "https://2.gravatar.com/userimage/277172047/599489b917ada4c8af9a7add57a38d56?size=256" },
            { nome: "MARILENE COSTA", partido: "PV", foto: "https://2.gravatar.com/userimage/277172047/649f18d55aefc7b14c929b5b4cbb3f0d?size=256" },
            { nome: "JOSÉ LINDOMAR", partido: "MDB", foto: "https://1.gravatar.com/userimage/277172047/8b0bc09db080b520bb5efcac97fdac7d?size=256" },
            { nome: "MARIA NLZA", partido: "PL", foto: "https://1.gravatar.com/userimage/277172047/1664047f373debf8b5651065a72ff1ea?size=256" },
            { nome: "GILSON JUNIOR", partido: "PSOL", foto: "https://1.gravatar.com/userimage/277172047/663db92eb90b94a5fce1914f09f97435?size=256" },
        ];

        // Renderizar parlamentares
        parlamentares.forEach((p, index) => {
            $('#container-parlamentares').append(`
                <div class="card-parlamentar" data-id="${index}">
                    <div class="foto-perfil">
                        <img src="${p.foto}" alt="${p.nome}">
                    </div>
                    <strong class="nome-parlamentar">${p.nome}</strong>
                    <span class="partido">${p.partido}</span>
                    <div class="botoes-voto">
                        <button class="btn-voto sim" onclick="votar(${index}, 'SIM')">SIM</button>
                        <button class="btn-voto abs" onclick="votar(${index}, 'ABS')">ABS</button>
                        <button class="btn-voto nao" onclick="votar(${index}, 'NÃO')">NÃO</button>
                    </div>
                </div>
            `);
        });
    });

    let votos = {};

    function votar(id, tipo) {
        // Marca o botão como ativo visualmente
        $(`.card-parlamentar[data-id="${id}"] .btn-voto`).removeClass('active');
        $(`.card-parlamentar[data-id="${id}"] .btn-voto:contains("${tipo}")`).addClass('active');
        
        // Registra o voto
        votos[id] = tipo;
        atualizarPlacar();
    }

    function atualizarPlacar() {
        let sim = 0;
        let nao = 0;
        
        Object.values(votos).forEach(v => {
            if (v === 'SIM') sim++;
            if (v === 'NÃO') nao++;
        });

        const display = $('#resultado-final');

        if (sim === 0 && nao === 0) {
            display.text("AGUARDANDO").css("background", "#ff9f00");
        } else if (sim > nao) {
            display.text("APROVADO").css("background", "#28a745");
        } else if (nao > sim) {
            display.text("REPROVADO").css("background", "#dc3545");
        } else {
            display.text("EMPATE").css("background", "#ff9f00");
        }
    }
</script>

</body>
</html>
