<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara Municipal de Almadina - Tribuna</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary-blue: #0a1e3d;
            --secondary-blue: #162d50;
            --gold: #c5a059;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: var(--primary-blue);
            color: var(--white);
            overflow: hidden; /* Evita scroll em TVs */
        }

        /* Container Principal */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Cabeçalho */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--gold);
        }

        /* Card Central */
        .main-card {
            background-color: var(--secondary-blue);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 90%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Perfil */
        .profile-area {
            text-align: center;
            flex: 1;
        }

        .photo-frame {
            width: 300px;
            height: 300px;
            border: 5px solid var(--gold);
            margin: 0 auto 20px;
            overflow: hidden;
            background-color: #ddd;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name { font-size: 2.5rem; font-weight: bold; margin-bottom: 5px; }
        .party { font-size: 1.5rem; color: #4aa3df; }

        /* Cronômetro */
        .timer-area {
            text-align: center;
            flex: 1;
        }

        .timer-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #aaa;
        }

        .timer-display {
            font-size: 10rem;
            font-weight: bold;
            color: var(--gold);
            margin: 10px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Botão */
        .btn-next {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-next:hover {
            background: var(--gold);
            border-color: var(--gold);
        }

        /* Responsividade para Telas Menores */
        @media (max-width: 768px) {
            .main-card { flex-direction: column; padding: 20px; }
            .timer-display { font-size: 5rem; }
            .photo-frame { width: 200px; height: 200px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Câmara Municipal de Almadina</h1>
        <p><marquee>Sessão Plenária - Primeiro Expediente - Tempo de Tribuna.</marquee></p>
    </header>

    <div class="main-card">
        <div class="profile-area">
            <div class="photo-frame">
                <img id="parlamentar-img" src="https://via.placeholder.com/300" alt="Foto">
            </div>
            <div class="name" id="parlamentar-nome">Carregando...</div>
            <div class="party" id="parlamentar-partido">Vereador (a)</div>
        </div>

        <div class="timer-area">
            <div class="timer-label">Tempo Restante</div>
            <div class="timer-display" id="display">05:00</div>
            <button class="btn-next" id="nextBtn">Próximo Edil</button>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // Dados dos 9 parlamentares (Exemplo)
    const parlamentares = [
        { nome: "Sylas Oliveira", partido: "P.L", img: "https://2.gravatar.com/userimage/277172047/599489b917ada4c8af9a7add57a38d56?size=256" },
        { nome: "Lucas Cavalcante", partido: "PL", img: "https://2.gravatar.com/userimage/277172047/21cee79305a9e7882d6ae14f87a77652?size=256" },
        { nome: "José Lindomar", partido: "MDB", img: "https://1.gravatar.com/userimage/277172047/8b0bc09db080b520bb5efcac97fdac7d?size=256" },
        { nome: "Maria Nilza", partido: "PT", img: "https://1.gravatar.com/userimage/277172047/1664047f373debf8b5651065a72ff1ea?size=256" },
        { nome: "Jackson Souza", partido: "PSDB", img: "https://2.gravatar.com/userimage/277172047/8039d08ed8a294328b8f8b70bbbeb765?size=256" },
        { nome: "Marilene Costa", partido: "PP", img: "https://2.gravatar.com/userimage/277172047/649f18d55aefc7b14c929b5b4cbb3f0d?size=256" },
        { nome: "Gilson Junior", partido: "PDT", img: "https://1.gravatar.com/userimage/277172047/663db92eb90b94a5fce1914f09f97435?size=256" },
        { nome: "Wilson Freitas", partido: "PSB", img: "https://0.gravatar.com/userimage/277172047/9342d191dbd2a0115384f72754b0056b?size=256" },
        { nome: "Rogério Gotado", partido: "REDE", img: "https://2.gravatar.com/userimage/277172047/cd0c7fd16ed7a3be204e382e86af7e23?size=256" }
    ];

    let currentIndex = 0;
    let timeLeft = 300; // 5 minutos em segundos
    let timerId = null;

    function updateDisplay() {
        const p = parlamentares[currentIndex];
        $('#parlamentar-nome').text(p.nome);
        $('#parlamentar-partido').text(p.party);
        $('#parlamentar-img').attr('src', p.img);
        
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        $('#display').text(`${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`);

        // Alerta visual quando falta 30 segundos
        if(timeLeft <= 30) {
            $('#display').css('color', '#ff4444');
        } else {
            $('#display').css('color', 'var(--gold)');
        }
    }

    function startTimer() {
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                alert("Tempo esgotado para " + parlamentares[currentIndex].nome);
            }
        }, 1000);
    }

    $('#nextBtn').click(function() {
        currentIndex++;
        if (currentIndex >= parlamentares.length) {
            currentIndex = 0; // Reinicia o ciclo
            alert("Ciclo de discursos finalizado.");
        }
        timeLeft = 300; // Reseta para 5 minutos
        updateDisplay();
        startTimer();
    });

    // Inicialização
    updateDisplay();
    startTimer();
});
</script>

</body>
</html>
