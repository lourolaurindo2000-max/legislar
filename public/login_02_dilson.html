<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acesso restrito – Dilson</title>
<style>
:root{--bg:#0F1A17;--card:#17251F;--ink:#E8EFEB;--muted:#93A39B;--line:#2B3D35;--brand:#2F7A66;--accent:#D1A64A;--danger:#E58A7E}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:1.5rem}
form{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2rem}
h1{margin:0 0 .25rem;font:600 1.6rem Georgia,"Times New Roman",serif}
p{margin:0 0 1.5rem;color:var(--muted)}
label{display:block;margin:0 0 1rem;font-weight:600;font-size:.95rem}
input{width:100%;margin-top:.35rem;min-height:52px;padding:.6rem .85rem;border-radius:10px;border:1px solid var(--line);background:#0F1A17;color:var(--ink);font:inherit;font-size:1.1rem}
input::placeholder{opacity:.1;color:#fff}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{width:100%;min-height:52px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:600 1.05rem inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#err{min-height:1.5rem;margin:0 0 .6rem;color:var(--danger)}
.rodape{margin-top:1.2rem;text-align:center;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<form id="f" autocomplete="off">
 <h1>Acesso ao Vereador</h1>
 <p>Acesso restrito ao vereador deste aparelho.</p>
 <label>Nome<input id="u" type="text" placeholder="Dilson" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
 <label>Senha<input id="p" type="password" autocomplete="current-password" required></label>
 <div id="err" role="alert"></div>
 <button id="b" type="submit">Entrar</button>
 <div class="rodape">Câmara Municipal de Almadina-BA</div>
</form>
<script>
// ===== CONFIGURAÇÃO =====
var DESTINO = "https://lourolaurindo2000-max.github.io/legislar/farm.html";
var SAL = "plenario-camara-v1";
var HASH = "a69b580e0ff0a2479142a0fb356f5cf1ccadb65764b5d523020c34274db6067d";
var NOME_APARELHO = "Dilson";
// ========================
function sha256(ascii){
 function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),i,j,res="",words=[],len=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};
 for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
 ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return "";words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((len/mw)|0);words[words.length]=len;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
 }
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:"")+b.toString(16)}
 return res;
}
function norm(s){try{s=s.normalize("NFD")}catch(e){}return s.replace(/[\u0300-\u036f]/g,"").trim().toLowerCase()}
var f=document.getElementById("f"),err=document.getElementById("err"),btn=document.getElementById("b");
var falhas=0,bloqueio=0;
f.addEventListener("submit",function(e){
 e.preventDefault();
 if(Date.now()<bloqueio)return;
 var nome=norm(document.getElementById("u").value),senha=norm(document.getElementById("p").value.replace(/^\s+|\s+$/g,""));
 if(sha256(SAL+"|"+nome+"|"+senha)===HASH){
  err.textContent="";
  try{sessionStorage.setItem("vereador_logado",NOME_APARELHO)}catch(x){}
  try{localStorage.setItem("vereador_logado",NOME_APARELHO)}catch(x){}
  location.href=DESTINO+(DESTINO.indexOf("?")>-1?"&":"?")+"vereador="+encodeURIComponent(NOME_APARELHO);
 }else{
  falhas++;document.getElementById("p").value="";
  if(falhas>=5){bloqueio=Date.now()+30000;falhas=0;btn.disabled=true;err.textContent="Muitas tentativas. Aguarde 30 segundos.";setTimeout(function(){btn.disabled=false;err.textContent=""},30000)}
  else{err.textContent="Nome ou senha incorretos.";document.getElementById("p").focus()}
 }
});
</script>
</body>
</html>
